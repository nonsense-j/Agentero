[package]
name = "agentero-mcp"
version = "0.15.4"
edition = "2021"
description = "Streamable HTTP MCP server shared by the Agentero desktop app and CLI"
authors = ["you"]
license = "MIT"
publish = false

[dependencies]
agentero-core = { path = "../agentero-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
axum = { workspace = true }
rmcp = { workspace = true }
schemars = "1"
specta = { workspace = true }
base64 = "0.22"
async-trait = "0.1.91"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
rmcp = { version = "3.1", default-features = false, features = ["client", "transport-io"] }
