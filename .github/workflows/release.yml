name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target desktop platform to build (desktop = windows + macos-arm64)"
        required: false
        default: "desktop"
        type: choice
        options:
          - desktop
          - windows
          - macos-arm64
          - macos-x64
          - linux-x64
          - linux-arm64
          - all
      tag:
        description: "Release tag name (e.g. v0.16.0)"
        required: false
        default: "v0.16.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.16.0' }}
  TARGET_PLATFORM: ${{ github.event.inputs.platform || 'desktop' }}

jobs:
  prepare:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ contains(env.RELEASE_TAG, '-') }}
        run: |
          set -euo pipefail
          NOTES="Desktop installers for Dovero ${RELEASE_TAG}."
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Dovero ${RELEASE_TAG}" \
              --notes "${NOTES}" \
              --draft=false \
              --prerelease="${IS_PRERELEASE}"
          else
            args=(
              release create "${RELEASE_TAG}"
              --repo "${GITHUB_REPOSITORY}"
              --title "Dovero ${RELEASE_TAG}"
              --notes "${NOTES}"
              --target "${GITHUB_SHA}"
            )
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi

  build-windows:
    name: Build Windows App (x64)
    needs: prepare
    if: ${{ (github.event.inputs.platform || 'desktop') == 'desktop' || github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Windows NSIS-only bundle & updater signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "HAS_UPDATER_KEY=false" >> "$GITHUB_ENV"
            HAS_KEY=false
          else
            echo "HAS_UPDATER_KEY=true" >> "$GITHUB_ENV"
            HAS_KEY=true
          fi
          HAS_KEY="$HAS_KEY" node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            if (c.bundle) {
              c.bundle.targets = ["nsis"];
              if (process.env.HAS_KEY !== "true") {
                c.bundle.createUpdaterArtifacts = false;
              }
            }
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '

      - name: Build Windows Tauri Installer
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Dovero ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          uploadUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          uploadUpdaterSignatures: ${{ env.HAS_UPDATER_KEY == 'true' }}
          updaterJsonPreferNsis: true

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dovero-Windows-x64-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

  build-macos-arm64:
    name: Build macOS App (Apple Silicon)
    needs: prepare
    if: ${{ (github.event.inputs.platform || 'desktop') == 'desktop' || github.event.inputs.platform == 'macos-arm64' || github.event.inputs.platform == 'all' }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure unsigned updater for fork builds
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "HAS_UPDATER_KEY=false" >> "$GITHUB_ENV"
            node -e '
              const fs = require("fs");
              const p = "src-tauri/tauri.conf.json";
              const c = JSON.parse(fs.readFileSync(p, "utf8"));
              if (c.bundle) c.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            '
          else
            echo "HAS_UPDATER_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: Build macOS (Apple Silicon) Tauri Installer
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Dovero ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          uploadUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          uploadUpdaterSignatures: ${{ env.HAS_UPDATER_KEY == 'true' }}

  build-macos-x64:
    name: Build macOS App (Intel x64)
    needs: prepare
    if: ${{ github.event.inputs.platform == 'macos-x64' || github.event.inputs.platform == 'all' }}
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure unsigned updater for fork builds
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "HAS_UPDATER_KEY=false" >> "$GITHUB_ENV"
            node -e '
              const fs = require("fs");
              const p = "src-tauri/tauri.conf.json";
              const c = JSON.parse(fs.readFileSync(p, "utf8"));
              if (c.bundle) c.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            '
          else
            echo "HAS_UPDATER_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: Build macOS (Intel) Tauri Installer
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Dovero ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          uploadUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          uploadUpdaterSignatures: ${{ env.HAS_UPDATER_KEY == 'true' }}

  build-linux-x64:
    name: Build Linux App (x64)
    needs: prepare
    if: ${{ github.event.inputs.platform == 'linux-x64' || github.event.inputs.platform == 'all' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure unsigned updater for fork builds
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "HAS_UPDATER_KEY=false" >> "$GITHUB_ENV"
            node -e '
              const fs = require("fs");
              const p = "src-tauri/tauri.conf.json";
              const c = JSON.parse(fs.readFileSync(p, "utf8"));
              if (c.bundle) c.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            '
          else
            echo "HAS_UPDATER_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: Build Linux (x64) Tauri Installer
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Dovero ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          uploadUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          uploadUpdaterSignatures: ${{ env.HAS_UPDATER_KEY == 'true' }}

  build-linux-arm64:
    name: Build Linux App (ARM64)
    needs: prepare
    if: ${{ github.event.inputs.platform == 'linux-arm64' || github.event.inputs.platform == 'all' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure unsigned updater for fork builds
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "HAS_UPDATER_KEY=false" >> "$GITHUB_ENV"
            node -e '
              const fs = require("fs");
              const p = "src-tauri/tauri.conf.json";
              const c = JSON.parse(fs.readFileSync(p, "utf8"));
              if (c.bundle) c.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            '
          else
            echo "HAS_UPDATER_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: Build Linux (ARM64) Tauri Installer
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Dovero ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          uploadUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          uploadUpdaterSignatures: ${{ env.HAS_UPDATER_KEY == 'true' }}

  updater-json:
    name: Rewrite updater manifest
    needs:
      - build-windows
      - build-macos-arm64
      - build-macos-x64
      - build-linux-x64
      - build-linux-arm64
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Point updater downloads at the release CDN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "Unsigned build; skipping latest.json rewrite."
            exit 0
          fi
          node scripts/rewrite-updater-json.mjs
