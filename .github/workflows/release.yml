name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target desktop platform to build (windows, macos-arm64, macos-x64, linux-x64, linux-arm64, all)"
        required: false
        default: "windows"
        type: choice
        options:
          - windows
          - macos-arm64
          - macos-x64
          - linux-x64
          - linux-arm64
          - all
      tag:
        description: "Release tag name (e.g. v0.15.4-se.1)"
        required: false
        default: "v0.15.4-se.1"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.15.4-se.1' }}
  TARGET_PLATFORM: ${{ github.event.inputs.platform || 'windows' }}

jobs:
  prepare:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Agentero ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body: |
            Desktop installers for Agentero ${{ env.RELEASE_TAG }} (AI & SE Plaza Overhaul + Magpie UI).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows App (x64)
    needs: prepare
    if: ${{ (github.event.inputs.platform || 'windows') == 'windows' || github.event.inputs.platform == 'all' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Windows NSIS-only bundle & unsigned updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "HAS_UPDATER_KEY=false" >> "$GITHUB_ENV"
            node -e '
              const fs = require("fs");
              const p = "src-tauri/tauri.conf.json";
              const c = JSON.parse(fs.readFileSync(p, "utf8"));
              if (c.bundle) {
                c.bundle.createUpdaterArtifacts = false;
                c.bundle.targets = ["nsis"];
              }
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            '
          else
            echo "HAS_UPDATER_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: Build Windows Tauri Installer
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Agentero ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          uploadUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          uploadUpdaterSignatures: ${{ env.HAS_UPDATER_KEY == 'true' }}
          updaterJsonPreferNsis: true

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agentero-Windows-x64-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

  build-macos-arm64:
    name: Build macOS App (Apple Silicon)
    needs: prepare
    if: ${{ github.event.inputs.platform == 'macos-arm64' || github.event.inputs.platform == 'all' }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure unsigned updater for fork builds
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "HAS_UPDATER_KEY=false" >> "$GITHUB_ENV"
            node -e '
              const fs = require("fs");
              const p = "src-tauri/tauri.conf.json";
              const c = JSON.parse(fs.readFileSync(p, "utf8"));
              if (c.bundle) c.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            '
          else
            echo "HAS_UPDATER_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: Build macOS (Apple Silicon) Tauri Installer
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Agentero ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          uploadUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          uploadUpdaterSignatures: ${{ env.HAS_UPDATER_KEY == 'true' }}

  build-macos-x64:
    name: Build macOS App (Intel x64)
    needs: prepare
    if: ${{ github.event.inputs.platform == 'macos-x64' || github.event.inputs.platform == 'all' }}
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure unsigned updater for fork builds
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "HAS_UPDATER_KEY=false" >> "$GITHUB_ENV"
            node -e '
              const fs = require("fs");
              const p = "src-tauri/tauri.conf.json";
              const c = JSON.parse(fs.readFileSync(p, "utf8"));
              if (c.bundle) c.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            '
          else
            echo "HAS_UPDATER_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: Build macOS (Intel) Tauri Installer
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Agentero ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          uploadUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          uploadUpdaterSignatures: ${{ env.HAS_UPDATER_KEY == 'true' }}

  build-linux-x64:
    name: Build Linux App (x64)
    needs: prepare
    if: ${{ github.event.inputs.platform == 'linux-x64' || github.event.inputs.platform == 'all' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure unsigned updater for fork builds
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "HAS_UPDATER_KEY=false" >> "$GITHUB_ENV"
            node -e '
              const fs = require("fs");
              const p = "src-tauri/tauri.conf.json";
              const c = JSON.parse(fs.readFileSync(p, "utf8"));
              if (c.bundle) c.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            '
          else
            echo "HAS_UPDATER_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: Build Linux (x64) Tauri Installer
