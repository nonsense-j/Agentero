          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Agentero ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          uploadUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          uploadUpdaterSignatures: ${{ env.HAS_UPDATER_KEY == 'true' }}

  build-linux-arm64:
    name: Build Linux App (ARM64)
    needs: prepare
    if: ${{ github.event.inputs.platform == 'linux-arm64' || github.event.inputs.platform == 'all' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
