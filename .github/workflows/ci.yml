name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    name: TypeScript (${{ matrix.task }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - quality
          - test-1
          - test-2
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert desktop package does not embed CLI
        if: matrix.task == 'quality'
        # Desktop installers must not embed the headless CLI (#285). A prior
        # guard required beforeBuildCommand to run cli:bundle:stub; that stub
        # path was removed in 9dee13f0 after the fake Windows .exe triggered
        # "Unsupported 16-bit application" (#320 follow-up).
        run: |
          set -euo pipefail
          node --input-type=commonjs -e "
            const conf = require('./src-tauri/tauri.conf.json');
            const bins = (conf.bundle && conf.bundle.externalBin) || [];
            const allowed = [];
            const same = bins.length === allowed.length && bins.every((bin, i) => bin === allowed[i]);
            if (!same) {
              console.error('::error file=src-tauri/tauri.conf.json::bundle.externalBin must be empty, not the CLI (#285/#320). Got: ' + JSON.stringify(bins));
              process.exit(1);
            }
          "
      - name: Test release synchronization
        if: matrix.task == 'quality'
        run: node --test scripts/sync-atomgit-release.test.mjs scripts/rewrite-updater-json.test.mjs
      - name: Stage bundled ACP adapters
        if: matrix.task == 'quality'
        # Exercise staging before release builds consume these trees.
        run: pnpm adapters:stage
      - name: Check formatting and lint
        if: matrix.task == 'quality'
        run: pnpm exec biome ci .
      - name: Check TypeScript types
        if: matrix.task == 'quality'
        run: pnpm typecheck
      - name: Check generated OpenUI catalog
        if: matrix.task == 'quality'
        run: node scripts/generate-openui-catalog.mjs --check
      - name: Check dependency boundaries
        if: matrix.task == 'quality'
        run: pnpm deps:check
      - name: Run frontend tests
        if: matrix.task != 'quality'
        run: pnpm exec vitest run --shard=${{ matrix.task == 'test-1' && '1/2' || '2/2' }}

  rust:
    name: Rust (${{ matrix.task }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        task:
          - quality
          - agentero-tests
          - cli-tests
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Stage bundled ACP adapters
        if: matrix.task != 'cli-tests'
        run: node scripts/prepare-adapters.mjs
      - name: Provision PDFium
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # liteparse-pdfium-sys fetches PDFium in its build script into an OS
          # cache dir that Swatinem/rust-cache does not persist. On a cache hit
          # the build script is skipped, so libpdfium.dylib is absent when tests
          # dlopen it. Provision it explicitly and point both the build script
          # and the runtime loader at a stable directory. The staging script owns
          # the release tag, so CI never drifts from liteparse-pdfium-sys.
          node scripts/prepare-pdfium.mjs --extract "$RUNNER_TEMP/pdfium"
          echo "PDFIUM_LIB_PATH=$RUNNER_TEMP/pdfium/lib" >> "$GITHUB_ENV"
          echo "PDFIUM_INCLUDE_PATH=$RUNNER_TEMP/pdfium/include" >> "$GITHUB_ENV"
          # tauri.macos.conf.json lists pdfium/libpdfium.dylib under
          # bundle.macOS.frameworks; tauri-build hard-fails when the file is
          # missing even for clippy/tests that never bundle.
          mkdir -p src-tauri/pdfium
          cp "$RUNNER_TEMP/pdfium/lib/libpdfium.dylib" src-tauri/pdfium/libpdfium.dylib
      - name: Run Rust checks
        run: |
          set -euo pipefail
          case "${{ matrix.task }}" in
            quality)
              cargo fmt --all --check
              cargo clippy --workspace --all-targets -- -D warnings
              ;;
            agentero-tests)
              cargo test -p agentero
              ;;
            cli-tests)
              # Dependency builds do not run core/MCP unit tests. Keep all
              # headless packages in this job to share PDFium and artifacts.
              cargo test -p agentero-core -p agentero-mcp -p agentero-cli
              cargo build -p agentero-cli
              ;;
            *)
              echo "::error::Unknown Rust CI task: ${{ matrix.task }}"
              exit 1
              ;;
          esac

  # Same three tasks as `rust` above. macos-15 never compiles `#[cfg(windows)]`.
  rust-windows:
    name: Rust windows (${{ matrix.task }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - quality
          - agentero-tests
          - cli-tests
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Stage bundled ACP adapters
        if: matrix.task != 'cli-tests'
        run: node scripts/prepare-adapters.mjs
      - name: Stage PDFium
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-pdfium.mjs
      - name: Point PDFium at the staged library
        shell: bash
        run: echo "PDFIUM_LIB_PATH=$GITHUB_WORKSPACE/src-tauri/pdfium" >> "$GITHUB_ENV"
      - name: Run Rust checks
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.task }}" in
            quality)
              cargo fmt --all --check
              cargo clippy --workspace --all-targets -- -D warnings
              ;;
            agentero-tests)
              cargo test -p agentero
              ;;
            cli-tests)
              # Dependency builds do not run core/MCP unit tests. Keep all
              # headless packages in this job to share PDFium and artifacts.
              cargo test -p agentero-core -p agentero-mcp -p agentero-cli
              cargo build -p agentero-cli
              ;;
            *)
              echo "::error::Unknown Rust CI task: ${{ matrix.task }}"
              exit 1
              ;;
          esac
