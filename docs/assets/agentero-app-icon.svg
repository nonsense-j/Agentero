<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Dovero">
  <title>Dovero</title>
  <!-- Pure white rounded squircle with subtle edge hairline for light UI surfaces -->
  <rect x="16" y="16" width="992" height="992" rx="220" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="8"/>
  <!-- Dovero origami messenger dove (5 geometric facets, dark ink charcoal) -->
  <g fill="#22272E" transform="translate(512 512) scale(1.36) translate(-511 -512)">
    <!-- Upper-left primary wing -->
    <polygon points="260,266 482,316 458,524"/>
    <!-- Lower-left secondary wing -->
    <polygon points="242,368 314,366 436,524"/>
    <!-- Central folded body -->
    <polygon points="498,328 676,550 442,686"/>
    <!-- Tail facet -->
    <polygon points="452,570 414,736 300,758"/>
    <!-- Head and beak -->
    <polygon points="592,418 666,326 716,332 780,370 712,389 681,526"/>
  </g>
</svg>
