[package]
name = "agentero"
version = "0.15.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
# Keep `rlib` only for desktop dev/release builds: `staticlib` + `cdylib` write
# ~5 GB of mobile archive/DLL/PDB artifacts on every incremental link; re-add
# them only when unfreezing iOS/Android packaging.
name = "agentero_lib"
crate-type = ["rlib"]

[[bin]]
name = "agentero"
path = "src/main.rs"
# The desktop GUI binary needs the desktop stack; headless builds
# (`--no-default-features`, e.g. for agentero-cli) skip it.
required-features = ["desktop"]

[features]
bindings-export = ["desktop"]
default = ["desktop"]
desktop = [
  "dep:agent-client-protocol",
  "dep:axum",
  "dep:tauri",
  "dep:tauri-plugin-deep-link",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-fs",
  "dep:tauri-plugin-log",
  "dep:fern",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-window-state",
  "dep:tauri-specta",
  "dep:specta-typescript",
  "dep:rmcp",
  "dep:agentero-mcp",
  "dep:schemars",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Redirects the XDG dirs to a temp dir before unit tests start (lib.rs).
ctor = "0.8"
# In-memory MCP protocol tests; no listener or permanent service.
rmcp = { version = "3.1", default-features = false, features = ["client", "transport-io"] }
tempfile = { workspace = true }
# `start_paused` virtual clock for stream coalescer / throttle unit tests.
tokio = { workspace = true, features = ["test-util", "macros"] }

[dependencies]
# Tauri-independent foundations (errors, fs, http, paths, sqlite, usage log),
# re-exported as `crate::core::*`. Must stay free of tauri/wry/tao.
agentero-core = { path = "../crates/agentero-core" }
agentero-mcp = { path = "../crates/agentero-mcp", optional = true }
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-fs = { version = "2.5.1", optional = true }
tauri-plugin-dialog = { version = "2.7.1", optional = true }
tauri-plugin-deep-link = { version = "2.4.9", optional = true }
# session/load replay relies on the SDK's notification/response ordering.
agent-client-protocol = { version = "1.3.0", features = ["unstable_elicitation"], optional = true }
tokio = { workspace = true }
# Per-job CancellationToken for the JobCenter cancel path (no global flag state).
tokio-util = { workspace = true }
axum = { workspace = true, optional = true }
# Streamable HTTP MCP server (Settings toggle; loopback only).
rmcp = { workspace = true, optional = true }
schemars = { version = "1", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = { workspace = true }
which = "7"
semver = "1"
rusqlite = { workspace = true }
reqwest = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
flate2 = "1.1.9"
tar = "0.4.46"
# 9.0.5+ fixes the zip-cloaking and symlink extraction advisories (GHSA-m665-v7pm-7grj).
zip = { version = "9.1", default-features = false, features = ["deflate"] }
htmd = "0.5.4"
notify-debouncer-full = "0.3"
log = { workspace = true }
tauri-plugin-log = { version = "2.9.0", optional = true }
fern = { version = "0.7.1", optional = true }
async-trait = "0.1.91"
sha2 = "0.11.0"
hex = "0.4.3"
walkdir = "2.5.0"
base64 = "0.22"
encoding_rs = "0.8"
urlencoding = "2"
url = "2"
# Used by lookup batch import (all platforms).
futures-util = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"], optional = true }
specta = { workspace = true }
specta-typescript = { version = "0.0.12", optional = true }
# System font enumeration for editor font settings.
fontdb = "0.22"

# Updates and process relaunch are desktop-only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2.14.1", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"], optional = true }
tauri-plugin-window-state = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow"] }

# Windows CLI install: add the shim dir to the user PATH (HKCU\Environment) so
# new terminals can run `agentero-cli` without manual setup.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
roxmltree = "0.20"
# Match the WebView2 interface versions used by Tauri/Wry.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[[example]]
name = "export_bindings"
required-features = ["bindings-export"]
